[versions]
kotlin = "2.2.20"
coroutines = "1.10.2"
junitPlatform = "1.13.4"
okhttp = "5.3.0"
serialization = "1.9.0"

agp = "9.4.0"
compileSdk = "36"
minSdk = "33"
targetSdk = "36"

androidxCore = "1.18.0"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
composeBom = "2026.06.01"
sherpaOnnx = "1.13.8"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
junit4 = "4.13.2"
onnxruntime = "1.30.0"

# Not on Maven Central — Spotify publishes the App Remote SDK as a bare .aar on its GitHub
# releases page, which :android:spotify fetches and verifies at build time. The AAR needs Gson
# at runtime and does not declare it (spotify-plan.md A3).
spotifyAppRemote = "0.8.0"
gson = "2.11.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }

# The Spotify Web API half of the Spotify Sock: one GET against /v1/search and one POST for a
# client-credentials token (spotify-plan.md B, C). Pure JVM, so :socks:spotify stays testable
# without a device.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }

# Instrumented tests only — the STT suite needs a device, the model and a microphone-less
# room. Everything else in this project is tested on the JVM with JUnit 5.
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
onnxruntime-jvm = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
